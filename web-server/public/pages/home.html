<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Gourmand | Home</title>
    <link rel="stylesheet" href="../style/root.css">
    <link rel="stylesheet" href="../style/home.css">
    <link rel="stylesheet" href="../style/card.css">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="/profile">Profile</a></li>
            <li><a href="#">Create recipes</a></li>
            <li><button>Logout</button></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Welcome to Le Gourmand</h1>

    <section id="search-section">
        <h2>Find a recipe</h2>
        <form>
            <input type="search" id="search" name="q" placeholder="Search by recipe name...">
            <button type="submit">Search</button>
        </form>
    </section>

    <section id="filters">
        <h2>Filter Recipes</h2>
        <form>
            <fieldset>
                <legend>Country:</legend>
                <!-- Loaded dynamically -->
            </fieldset>
            <fieldset>
                <legend>Main Ingredient:</legend>
                <!-- Loaded dynamically -->
            </fieldset>
            <fieldset>
                <legend>Meal Type:</legend>
                <!-- Loaded dynamically -->
            </fieldset>
            <fieldset>
                <legend>Diet:</legend>
                <!-- Loaded dynamically -->
            </fieldset>
            <button type="submit">Apply Filters</button>
        </form>
    </section>

    <section id="recipes-list">
        <h3>All recipes</h3>
        <div class="recipes-grid">
            <!-- Recipes loaded dynamically -->
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Le Gourmand. All rights reserved.</p>
</footer>

<script src="/scripts/config.js"></script>
<script src="/scripts/checkAuth.js"></script>
<script src="/scripts/home.js"></script>
</body>
</html>
