<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Gourmand | Sign In</title>
    <link rel="stylesheet" href="../style/root.css">
    <link rel="stylesheet" href="../style/signin.css">
</head>
<body>
<main>
    <h1>Sign In</h1>
    <form id="signinForm">
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Sign in</button>
        <p class="redirect-link">
            Don't have an account? <br> <a href="../pages/signup.html">Sign Up</a>
        </p>
    </form>

    <div id="errorMessage" style="display: none; color: red; margin-top: 10px;"></div>
</main>
<footer>
    <p>&copy; 2026 Le Gourmand. All rights reserved.</p>
</footer>

<script src="/scripts/config.js"></script>
<script src="/scripts/signin.js"></script>
</body>
</html>
