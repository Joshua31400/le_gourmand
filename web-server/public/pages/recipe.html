<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Gourmand | Recipe</title>
    <link rel="stylesheet" href="../style/root.css">
    <link rel="stylesheet" href="../style/recipes.css">
    <link rel="stylesheet" href="../style/create_recipe_modal.css">
    <link rel="icon" type="image/png" href="/assets/favicon.webp">
</head>
<body>

<header>
    <nav>
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/profile" class="nav-active">Profile</a></li>
            <li><a href="#" id="createRecipeBtn">Create recipe</a></li>
            <li><button id="logoutBtn">Logout</button></li>
        </ul>
    </nav>
</header>

<main>
    <article>

        <!-- HERO -->
        <div class="recipe-hero">
            <img src="" alt="Dish image">
            <div class="recipe-hero-text">
                <h1>Recipe Name</h1>
                <div class="recipe-rating">
                    <div id="ratingStars" class="rating-stars"></div>
                    <span class="score">N/A</span>
                </div>
                <div class="hero-actions">
                    <button type="button" id="favoriteBtn">♡ Add to favorites</button>
                    <button type="button" id="shareBtn" class="btn-outline">↗ Share</button>
                </div>
            </div>
        </div>

        <!-- DESCRIPTION -->
        <div class="detail-section" id="description">
            <h2>Description</h2>
            <p></p>
        </div>

        <!-- INFORMATION -->
        <div class="detail-section" id="infos">
            <h2>Information</h2>
            <dl></dl>
        </div>

        <!-- INGREDIENTS -->
        <div class="detail-section" id="ingredients">
            <h2>Ingredients</h2>
            <ul></ul>
        </div>

        <!-- PREPARATION -->
        <div class="detail-section" id="preparation">
            <h2>Preparation</h2>
            <ol></ol>
        </div>

    </article>


</main>

<div id="createRecipeModal" class="modal">
    <div class="modal-content modal-large">
        <span class="close">&times;</span>
        <h2>Create New Recipe</h2>
        <form id="createRecipeForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="recipeName">Recipe Name: *</label>
                    <input type="text" id="recipeName" required>
                </div>

                <div class="form-group">
                    <label for="recipeImage">Recipe Image:</label>
                    <input type="file" id="recipeImage" accept="image/jpeg,image/jpg,image/png,image/gif">
                    <small>Max 5MB. Formats: JPG, PNG, GIF</small>
                    <p id="recipeFileName"></p>
                </div>
            </div>

            <div class="form-group">
                <label for="recipeDescription">Description: *</label>
                <textarea id="recipeDescription" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="recipePreparation">Preparation Steps: *</label>
                <textarea id="recipePreparation" rows="6" required placeholder="Enter each step on a new line"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="recipeType">Meal Type: *</label>
                    <select id="recipeType" required>
                        <option value="">Select type...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="recipeDiet">Diet: *</label>
                    <select id="recipeDiet" required>
                        <option value="">Select diet...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="recipeCountry">Country: *</label>
                    <select id="recipeCountry" required>
                        <option value="">Select country...</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="recipeIngredients">Ingredients: *</label>
                <select id="recipeIngredients">
                    <option value="">Select ingredients...</option>
                </select>
                <small>Select an ingredient to add it to your recipe</small>
                <div id="selectedIngredients" class="chips-container"></div>
            </div>

            <button type="submit">Create Recipe</button>
        </form>
        <div id="createMessage"></div>
    </div>
</div>

<footer>
    <p>&copy; 2026 Le Gourmand. All rights reserved.</p>
</footer>

<script src="/scripts/config.js"></script>
<script src="/scripts/checkAuth.js"></script>
<script src="/scripts/recipe.js"></script>
<script src="/scripts/create_recipe.js"></script>

</body>
</html>
