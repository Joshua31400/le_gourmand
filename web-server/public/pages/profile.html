<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Gourmand | Profile</title>
    <link rel="stylesheet" href="../style/root.css">
    <link rel="stylesheet" href="../style/profile.css">
    <link rel="stylesheet" href="../style/card.css">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/profile">My Profile</a></li>
            <li><button id="logoutBtn">Logout</button></li>
        </ul>
    </nav>
</header>

<main>
    <section id="user-info">
        <img src="https://via.placeholder.com/64" alt="User picture" id="user-picture">
        <div>
            <h1 id="username">Loading...</h1>
            <p id="user-email"></p>
            <button id="editProfileBtn" style="display: none; margin-top: 1rem;">Edit Profile</button>
        </div>
    </section>

    <section id="favorites">
        <h2>Favorite Recipes (<span id="favorites-count">0</span>)</h2>
        <div id="favorites-grid" class="recipes-grid"></div>
    </section>

    <section id="shared">
        <h2>Shared Recipes (<span id="shared-count">0</span>)</h2>
        <div id="shared-grid" class="recipes-grid"></div>
    </section>

    <section id="my-recipes">
        <h2>My Recipes (<span id="recipes-count">0</span>)</h2>
        <div id="recipes-grid" class="recipes-grid"></div>
    </section>
</main>

<div id="editProfileModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Edit Profile</h2>
        <form id="editProfileForm">
            <div class="form-group">
                <label for="profilePicture">Profile Picture:</label>
                <input type="file" id="profilePicture" name="picture" accept="image/jpeg,image/jpg,image/png,image/gif">
                <small>Max 5MB. Formats: JPG, PNG, GIF</small>
                <p id="fileName" style="margin-top: 0.5rem; color: #666; font-style: italic;"></p>
            </div>

            <div class="form-group">
                <label for="editUsername">Username:</label>
                <input type="text" id="editUsername" name="username" required>
            </div>

            <button type="submit">Save Changes</button>
        </form>
        <div id="editMessage"></div>
    </div>
</div>

<footer>
    <p>&copy; 2026 Le Gourmand. All rights reserved.</p>
</footer>

<script src="/scripts/config.js"></script>
<script src="/scripts/checkAuth.js"></script>
<script src="/scripts/profile.js"></script>
</body>
</html>
