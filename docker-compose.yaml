services:
    # 1. LA BASE DE DONNÉES
    db:
        image: mysql:8.0
        container_name: le_gourmand_db
        restart: unless-stopped
        ports:
            - "3306:3306"
        environment:
            MYSQL_USER: ${DB_USER:-admin}
            MYSQL_PASSWORD: ${DB_PASSWORD:-azerty123!}
            MYSQL_DATABASE: bar_gourmand
            MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - gourmand-network

    # 2. L'API (BACKEND)
    api:
        build:
            context: ./api-server
            dockerfile: Dockerfile
        container_name: le_gourmand_api
        restart: unless-stopped
        ports:
            - "3001:3001"
        environment:
            - DB_HOST=db
            - DB_USER=${DB_USER:-admin}
            - DB_PASSWORD=${DB_PASSWORD:-azerty123!}
            - DB_NAME=bar_gourmand
            - JWT_SECRET=${JWT_SECRET:-super_secret_token_change_me}
        depends_on:
            - db
        networks:
            - gourmand-network

    # 3. L'INTERFACE WEB (FRONTEND)
    web:
        build:
            context: ./web-server
            dockerfile: Dockerfile
        container_name: le_gourmand_web
        restart: unless-stopped
        ports:
            - "3002:3002"
        environment:
            - API_URL=http://api:3001
        depends_on:
            - api
        networks:
            - gourmand-network

volumes:
    db-data:

networks:
    gourmand-network:
        driver: bridge